<!DOCTYPE html>
<html>
<head>
    <title>Manager JavaScript Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <div class="alert">Test Alert</div>
    <div class="format-currency">1234.56</div>
    <div class="format-number">9876</div>
    
    <script>
    // Test the manager footer JavaScript
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, testing JavaScript...');
        
        // Format NPR currency in tables
        const currencyElements = document.querySelectorAll('.format-currency');
        currencyElements.forEach(function(element) {
            let number = parseFloat(element.textContent);
            if (!isNaN(number)) {
                element.textContent = 'NPR ' + number.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }
        });
        
        // Format numbers in tables
        const numberElements = document.querySelectorAll('.format-number');
        numberElements.forEach(function(element) {
            let number = parseFloat(element.textContent);
            if (!isNaN(number)) {
                element.textContent = number.toLocaleString('en-IN');
            }
        });
        
        console.log('JavaScript test completed successfully!');
    });
    </script>
</body>
</html>
