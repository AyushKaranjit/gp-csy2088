<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGradient)"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="496" height="496" fill="none" stroke="#d1d5db" stroke-width="2" rx="8"/>
  
  <!-- Main shopping basket icon -->
  <g transform="translate(200, 180)">
    <!-- Basket body -->
    <path d="M10 40 L90 40 L85 120 L15 120 Z" fill="url(#iconGradient)" rx="4"/>
    
    <!-- Basket handles -->
    <path d="M25 40 C25 20, 75 20, 75 40" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Basket weave pattern -->
    <line x1="20" y1="55" x2="80" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="70" x2="80" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="85" x2="80" y2="85" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="100" x2="80" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    
    <!-- Vertical lines -->
    <line x1="35" y1="40" x2="35" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="50" y1="40" x2="50" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="65" y1="40" x2="65" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    
    <!-- Fresh produce items in basket -->
    <circle cx="40" cy="65" r="6" fill="#16a34a" opacity="0.7"/>
    <circle cx="60" cy="75" r="5" fill="#dc2626" opacity="0.7"/>
    <circle cx="45" cy="90" r="4" fill="#f59e0b" opacity="0.7"/>
  </g>
  
  <!-- Brand text -->
  <text x="250" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#374151">
    DOKO
  </text>
  
  <!-- Subtitle -->
  <text x="250" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">
    Fresh Groceries Delivered
  </text>
  
  <!-- Product placeholder text -->
  <text x="250" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">
    Product Image Coming Soon
  </text>
</svg>
